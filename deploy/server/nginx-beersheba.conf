# Beersheba — its own file. Does not change the other sites.
# Installed by deploy/server/nginx.sh, which fills in __DOMAIN__, __PORT__ and __MEDIA__.

upstream beersheba_django {
    server 127.0.0.1:__PORT__;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Certificate renewal for this domain only.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/beersheba-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

#HTTPS-START
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    root /var/www/beersheba;
    index index.html;
    client_max_body_size 25m;
    access_log /var/log/nginx/beersheba.access.log;
    error_log  /var/log/nginx/beersheba.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Django: API, admin (/manage-<random>/), its static files.
    location /api/ {
        proxy_pass http://beersheba_django;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
    location ^~ /manage- {
        proxy_pass http://beersheba_django;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    location ^~ /static/ {
        proxy_pass http://beersheba_django;
        include /etc/nginx/proxy_params;
        expires 7d;
    }

    # Uploaded files: only lot photos and certificates are public.
    # Export documents, consent forms, plot photos, contracts and evidence
    # packages are served only through logged-in Django views.
    location ^~ /media/lots/photos/ {
        alias __MEDIA__/lots/photos/;
        expires 7d;
    }
    location ^~ /media/certifications/ {
        alias __MEDIA__/certifications/;
    }
    location ^~ /media/ {
        return 404;
    }

    # Website (single-page app).
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
#HTTPS-END
